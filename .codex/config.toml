[mcp_servers.luogu]
command = "npx"
args = ["-y", "luogu-mcp-server@0.2.0"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

[mcp_servers.leetcode]
command = "npx"
args = ["-y", "@jinzcdev/leetcode-mcp-server@1.4.0"]
env_vars = ["LEETCODE_SESSION"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "auto"

[mcp_servers.leetcode.env]
LEETCODE_SITE = "cn"

# These tools change remote LeetCode state. Keep an explicit confirmation step.
[mcp_servers.leetcode.tools.run_code]
approval_mode = "prompt"

[mcp_servers.leetcode.tools.submit_solution]
approval_mode = "prompt"

[mcp_servers.leetcode.tools.create_note]
approval_mode = "prompt"

[mcp_servers.leetcode.tools.update_note]
approval_mode = "prompt"
